<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="author" content="Alparslan Demir">
    <title>NIGHT RACER 2026 | Alparslan Demir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1a 0%, #020408 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 520px;
        }

        .game-card {
            background: linear-gradient(145deg, #0f171f, #080e14);
            border-radius: 48px;
            padding: 16px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,200,80,0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0d191c;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .stats-panel {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-item {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 8px 10px;
            border-radius: 40px;
            text-align: center;
            flex: 1;
            border: 1px solid rgba(255,200,80,0.3);
        }

        .stat-label {
            font-size: 9px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffcc44;
            line-height: 1;
        }

        .info-bar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .info-piece {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 40px;
            text-align: center;
            flex: 1;
        }

        .info-label {
            font-size: 9px;
            color: #aaa;
        }

        .info-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffaa44;
        }

        .difficulty-badge {
            background: #e67e22;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 10px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .control-btn {
            flex: 1;
            background: #1a262e;
            border: none;
            padding: 12px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            color: #ffdd99;
            cursor: pointer;
            transition: 0.04s linear;
            box-shadow: 0 4px 0 #0a1115;
            font-family: monospace;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a1115;
        }

        .menu-control {
            background: #2a2a3c;
            box-shadow: 0 4px 0 #14141f;
        }

        .tip-line {
            font-size: 9px;
            text-align: center;
            margin-top: 12px;
            color: #6a7a85;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(145deg, #111a22, #070d12);
            width: 90%;
            max-width: 420px;
            border-radius: 56px;
            padding: 28px 22px;
            border: 2px solid #ffcc55;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h2 {
            color: #ffd966;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .year-badge {
            color: #ffaa44;
            font-size: 0.8rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .modal-stats {
            background: #00000055;
            padding: 15px;
            border-radius: 48px;
            margin: 15px 0;
        }

        .modal-stats p {
            color: #ddd;
            font-size: 1rem;
            margin: 8px 0;
        }

        .modal-stats span {
            color: #f7b32b;
            font-size: 1.4rem;
            font-weight: bold;
            margin-left: 8px;
        }

        .difficulty-selector {
            display: flex;
            gap: 12px;
            margin: 15px 0;
            justify-content: center;
        }

        .difficulty-opt {
            background: #2c3a44;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.07s;
        }

        .difficulty-opt.active {
            background: #e67e22;
            box-shadow: 0 2px 0 #9b4a0e;
        }

        .lang-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
        }

        .lang-opt {
            background: #2c3a44;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.07s;
        }

        .lang-opt.active {
            background: #e67e22;
        }

        .color-options {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .color-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.1s;
        }

        .color-circle.selected {
            border-color: white;
            transform: scale(1.1);
            box-shadow: 0 0 10px gold;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .menu-button {
            background: #2c3a44;
            border: none;
            padding: 10px;
            font-size: 1rem;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.07s linear;
        }

        .menu-button.primary {
            background: #e67e22;
            box-shadow: 0 3px 0 #9b4a0e;
        }

        .menu-button:active {
            transform: translateY(2px);
        }

        .credits {
            margin-top: 20px;
            padding-top: 15px;
            font-size: 11px;
            color: #ffcc88aa;
        }

        .credits strong {
            color: #ffcc44;
        }

        @media (max-width: 480px) {
            .stat-number { font-size: 1rem; }
            .info-number { font-size: 0.9rem; }
            .control-btn { font-size: 1.1rem; padding: 8px 0; }
            .modal-card h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-card">
        <div class="stats-panel">
            <div class="stat-item"><div class="stat-label" id="scoreLabel">SCORE</div><div class="stat-number" id="scoreValue">0</div></div>
            <div class="stat-item"><div class="stat-label" id="bestLabel">BEST</div><div class="stat-number" id="bestValue">0</div></div>
            <div class="stat-item"><div class="stat-label" id="difficultyLabel">DIFFICULTY</div><div class="stat-number difficulty-badge" id="difficultyText">Normal</div></div>
        </div>

        <canvas id="gameCanvas" width="480" height="600"></canvas>

        <div class="info-bar">
            <div class="info-piece"><div class="info-label" id="speedLabel">SPEED</div><div class="info-number" id="speedKm">0</div><div style="font-size:8px;">km/h</div></div>
            <div class="info-piece"><div class="info-label" id="timeLabel">TIME</div><div class="info-number" id="timerValue">00:00</div></div>
            <div class="info-piece"><div class="info-label" id="trafficLabel">TRAFFIC</div><div class="info-number" id="trafficDensity">Normal</div></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="leftControl">◀ LEFT</button>
            <button class="control-btn menu-control" id="menuControl">📋 MENU</button>
            <button class="control-btn" id="rightControl">RIGHT ▶</button>
        </div>
        <div class="tip-line" id="tipText">← → or A/D | 2026 Alparslan Demir</div>
    </div>
</div>

<div id="menuModal" class="modal">
    <div class="modal-card">
        <h2>🏁 NIGHT RACER</h2>
        <div class="year-badge">2026 ALPARSLAN DEMIR</div>
        
        <div class="modal-stats">
            <p id="menuBestText">🏆 BEST SCORE: <span id="menuBest">0</span></p>
            <p id="menuMaxSpeedText">🚀 MAX SPEED: <span id="menuMaxSpeed">0</span> km/h</p>
            <p id="menuGamesText">🎯 TOTAL GAMES: <span id="totalGames">0</span></p>
        </div>

        <div>
            <div style="color:#ffcc44; margin-bottom:8px; font-size:0.9rem;" id="langTitle">🌐 LANGUAGE</div>
            <div class="lang-selector">
                <button class="lang-opt" data-lang="en">ENGLISH</button>
                <button class="lang-opt" data-lang="de">DEUTSCH</button>
                <button class="lang-opt" data-lang="tr">TÜRKÇE</button>
            </div>
        </div>

        <div>
            <div style="color:#ffcc44; margin-bottom:8px; font-size:0.9rem;" id="difficultyTitle">🎮 DIFFICULTY</div>
            <div class="difficulty-selector">
                <button class="difficulty-opt" data-diff="easy" id="easyBtn">🟢 EASY</button>
                <button class="difficulty-opt active" data-diff="normal" id="normalBtn">🟡 NORMAL</button>
                <button class="difficulty-opt" data-diff="hard" id="hardBtn">🔴 HARD</button>
            </div>
        </div>

        <div>
            <div style="color:#ffcc44; margin-bottom:8px; font-size:0.9rem;" id="colorTitle">🎨 CAR COLOR</div>
            <div class="color-options" id="colorPalette">
                <div class="color-circle" style="background:#30d5ff;" data-color="#30d5ff"></div>
                <div class="color-circle" style="background:#ff4444;" data-color="#ff4444"></div>
                <div class="color-circle" style="background:#44ff44;" data-color="#44ff44"></div>
                <div class="color-circle" style="background:#ffaa44;" data-color="#ffaa44"></div>
                <div class="color-circle" style="background:#ff44ff;" data-color="#ff44ff"></div>
                <div class="color-circle" style="background:#ffffff;" data-color="#ffffff"></div>
            </div>
        </div>

        <div class="menu-buttons">
            <button class="menu-button primary" id="restartFromMenu" data-text-restart="RESTART">🔄 RESTART</button>
            <button class="menu-button" id="closeMenuButton" data-text-resume="RESUME GAME">🎮 RESUME GAME</button>
        </div>

        <div class="credits">
            <strong>NIGHT RACER 2026</strong><br>
            DEVELOPER: <strong>ALPARSLAN DEMIR</strong>
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 480, H = 600;
        canvas.width = W;
        canvas.height = H;

        const LANE_COUNT = 3;
        const LANE_W = W / LANE_COUNT;
        const CAR_W = 46;
        const CAR_H = 74;

        let player = { lane: 1, x: 0, y: H - 100, w: CAR_W, h: CAR_H };
        let enemies = [];
        let gameActive = true;
        let score = 0;
        let bestScore = 0;
        let currentSpeed = 4.2;
        let baseSpeed = 4.2;
        let frameCount = 0;
        let maxSpeedKm = 0;
        let totalGamesPlayed = 0;
        let difficulty = 'normal';
        let carColor = "#30d5ff";
        let raceTime = 0;
        let timerInterval = null;
        let invincible = 0;
        let currentLang = 'en';

        const translations = {
            en: {
                score: "SCORE", best: "BEST", difficulty: "DIFFICULTY", speed: "SPEED", time: "TIME", traffic: "TRAFFIC",
                tip: "← → or A/D | 2026 Alparslan Demir", easy: "EASY", normal: "NORMAL", hard: "HARD",
                menuBest: "🏆 BEST SCORE:", menuMaxSpeed: "🚀 MAX SPEED:", menuGames: "🎯 TOTAL GAMES:",
                langTitle: "🌐 LANGUAGE", difficultyTitle: "🎮 DIFFICULTY", colorTitle: "🎨 CAR COLOR",
                restart: "RESTART", resume: "RESUME GAME", gameOver: "GAME OVER", restartMsg: "RESTART FROM MENU"
            },
            de: {
                score: "PUNKTE", best: "BESTE", difficulty: "SCHWIERIGKEIT", speed: "GESCHW.", time: "ZEIT", traffic: "VERKEHR",
                tip: "← → oder A/D | 2026 Alparslan Demir", easy: "EINFACH", normal: "NORMAL", hard: "SCHWER",
                menuBest: "🏆 BESTPUNKTZAHL:", menuMaxSpeed: "🚀 HÖCHSTGESCHW.:", menuGames: "🎯 GESAMTSPIELE:",
                langTitle: "🌐 SPRACHE", difficultyTitle: "🎮 SCHWIERIGKEIT", colorTitle: "🎨 FARBE",
                restart: "NEUSTART", resume: "WEITERSPIELEN", gameOver: "SPIEL VORBEI", restartMsg: "NEUSTART IM MENÜ"
            },
            tr: {
                score: "SKOR", best: "REKOR", difficulty: "ZORLUK", speed: "HIZ", time: "SÜRE", traffic: "TRAFİK",
                tip: "← → veya A/D | 2026 Alparslan Demir", easy: "KOLAY", normal: "NORMAL", hard: "ZOR",
                menuBest: "🏆 EN İYİ SKOR:", menuMaxSpeed: "🚀 MAKSİMUM HIZ:", menuGames: "🎯 TOPLAM OYUN:",
                langTitle: "🌐 DİL", difficultyTitle: "🎮 ZORLUK", colorTitle: "🎨 ARABA RENGİ",
                restart: "YENİDEN BAŞLAT", resume: "OYUNA DÖN", gameOver: "OYUN BİTTİ", restartMsg: "MENÜ'DEN YENİDEN BAŞLAT"
            }
        };

        function updateUITexts() {
            const t = translations[currentLang];
            document.getElementById('scoreLabel').innerText = t.score;
            document.getElementById('bestLabel').innerText = t.best;
            document.getElementById('difficultyLabel').innerText = t.difficulty;
            document.getElementById('speedLabel').innerText = t.speed;
            document.getElementById('timeLabel').innerText = t.time;
            document.getElementById('trafficLabel').innerText = t.traffic;
            document.getElementById('tipText').innerText = t.tip;
            document.getElementById('menuBestText').innerHTML = `${t.menuBest} <span id="menuBest">${bestScore}</span>`;
            document.getElementById('menuMaxSpeedText').innerHTML = `${t.menuMaxSpeed} <span id="menuMaxSpeed">${maxSpeedKm}</span> km/h`;
            document.getElementById('menuGamesText').innerHTML = `${t.menuGames} <span id="totalGames">${totalGamesPlayed}</span>`;
            document.getElementById('langTitle').innerText = t.langTitle;
            document.getElementById('difficultyTitle').innerText = t.difficultyTitle;
            document.getElementById('colorTitle').innerText = t.colorTitle;
            document.getElementById('restartFromMenu').innerText = `🔄 ${t.restart}`;
            document.getElementById('closeMenuButton').innerText = `🎮 ${t.resume}`;
            document.querySelectorAll('.difficulty-opt').forEach(btn => {
                let diff = btn.getAttribute('data-diff');
                if(diff === 'easy') btn.innerText = `🟢 ${t.easy}`;
                else if(diff === 'hard') btn.innerText = `🔴 ${t.hard}`;
                else btn.innerText = `🟡 ${t.normal}`;
            });
        }

        function updatePlayerX() { let centerX = (player.lane * LANE_W) + (LANE_W/2); player.x = centerX - (CAR_W/2); }
        
        function refreshUI() {
            document.getElementById('scoreValue').innerText = Math.floor(score);
            let speedKmVal = Math.floor(currentSpeed * 22 + 38);
            if(speedKmVal > 350) speedKmVal = 350;
            document.getElementById('speedKm').innerText = speedKmVal;
            if(speedKmVal > maxSpeedKm) { maxSpeedKm = speedKmVal; document.getElementById('menuMaxSpeed').innerText = maxSpeedKm; }
            let diffText = difficulty === 'easy' ? (currentLang === 'tr' ? 'Kolay' : currentLang === 'de' ? 'Einfach' : 'Easy') : (difficulty === 'hard' ? (currentLang === 'tr' ? 'Zor' : currentLang === 'de' ? 'Schwer' : 'Hard') : (currentLang === 'tr' ? 'Normal' : currentLang === 'de' ? 'Normal' : 'Normal'));
            let trafficText = difficulty === 'easy' ? (currentLang === 'tr' ? 'Az' : currentLang === 'de' ? 'Wenig' : 'Light') : (difficulty === 'hard' ? (currentLang === 'tr' ? 'Yoğun' : currentLang === 'de' ? 'Dicht' : 'Heavy') : (currentLang === 'tr' ? 'Normal' : currentLang === 'de' ? 'Normal' : 'Normal'));
            document.getElementById('difficultyText').innerText = diffText;
            document.getElementById('trafficDensity').innerText = trafficText;
        }
        
        function loadBest() { let saved = localStorage.getItem('racer_2026_best'); if(saved && !isNaN(parseInt(saved))) bestScore = parseInt(saved); else bestScore = 0; document.getElementById('bestValue').innerText = bestScore; document.getElementById('menuBest').innerText = bestScore; }
        function saveBest() { let intScore = Math.floor(score); if(intScore > bestScore) { bestScore = intScore; localStorage.setItem('racer_2026_best', bestScore); document.getElementById('bestValue').innerText = bestScore; document.getElementById('menuBest').innerText = bestScore; } }
        
        function loadTotalGames() { let saved = localStorage.getItem('racer_total_games'); if(saved && !isNaN(parseInt(saved))) totalGamesPlayed = parseInt(saved); else totalGamesPlayed = 0; document.getElementById('totalGames').innerText = totalGamesPlayed; }
        function incrementTotalGames() { totalGamesPlayed++; localStorage.setItem('racer_total_games', totalGamesPlayed); document.getElementById('totalGames').innerText = totalGamesPlayed; }
        
        function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if(gameActive) { raceTime++; let mins = Math.floor(raceTime / 60); let secs = raceTime % 60; document.getElementById('timerValue').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`; } }, 1000); }
        function stopTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
        
        function getDifficultyMultiplier() { if(difficulty === 'easy') return { spawnBase: 48, speedMulti: 0.7 }; if(difficulty === 'hard') return { spawnBase: 28, speedMulti: 1.3 }; return { spawnBase: 40, speedMulti: 1.0 }; }
        
        function restartGame() {
            gameActive = true; score = 0; enemies = []; frameCount = 0; invincible = 0;
            baseSpeed = difficulty === 'easy' ? 3.5 : (difficulty === 'hard' ? 5.0 : 4.2);
            currentSpeed = baseSpeed; raceTime = 0; document.getElementById('timerValue').innerText = "00:00";
            player.lane = 1; updatePlayerX(); refreshUI(); saveBest(); stopTimer(); startTimer();
        }
        
        function changeLane(delta) { if(!gameActive) return; let newLane = player.lane + delta; if(newLane >= 0 && newLane < LANE_COUNT) { player.lane = newLane; updatePlayerX(); } }
        
        function spawnEnemy() {
            let laneChoice = Math.floor(Math.random() * LANE_COUNT);
            let xPos = (laneChoice * LANE_W) + (LANE_W/2) - (CAR_W/2);
            const enemyColors = ['#c2412c', '#b13e55', '#aa3e2e', '#cc5541', '#b0453a', '#9e3c2a', '#8b2c1a', '#c0392b'];
            let randColor = enemyColors[Math.floor(Math.random() * enemyColors.length)];
            enemies.push({ x: xPos, y: -CAR_H - Math.random() * 60, w: CAR_W-4, h: CAR_H, color: randColor });
        }
        
        function updateGame() {
            if(!gameActive) return;
            let diffMult = getDifficultyMultiplier().speedMulti;
            let speedBonus = Math.floor(score / 65) * 0.48 * diffMult;
            currentSpeed = baseSpeed + speedBonus;
            if(currentSpeed > 16.5) currentSpeed = 16.5;
            for(let i=0; i<enemies.length; i++) enemies[i].y += currentSpeed;
            let newEnemies = [];
            for(let e of enemies) { if(e.y > H) { score += 10; refreshUI(); saveBest(); continue; } newEnemies.push(e); }
            enemies = newEnemies;
            if(invincible > 0) invincible--;
            let playerRect = {x: player.x, y: player.y, w: CAR_W, h: CAR_H};
            for(let e of enemies) {
                let eRect = {x: e.x, y: e.y, w: e.w, h: e.h};
                if(playerRect.x < eRect.x + eRect.w && playerRect.x + playerRect.w > eRect.x && playerRect.y < eRect.y + eRect.h && playerRect.y + playerRect.h > eRect.y) {
                    if(invincible <= 0) { gameActive = false; saveBest(); stopTimer(); incrementTotalGames(); break; }
                }
            }
            frameCount++;
            let spawnDelay = getDifficultyMultiplier().spawnBase - Math.floor(score / 380);
            if(spawnDelay < 22) spawnDelay = 22;
            if(frameCount % spawnDelay === 0) { spawnEnemy(); if(difficulty === 'hard' && score > 120 && Math.random() < 0.45) spawnEnemy(); if(difficulty === 'hard' && score > 350 && Math.random() < 0.3) spawnEnemy(); }
            refreshUI();
        }
        
        function drawRoad() {
            let grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,"#1a2a2f"); grad.addColorStop(1,"#0b1518");
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            for(let i=1;i<LANE_COUNT;i++) { ctx.beginPath(); ctx.setLineDash([20,34]); ctx.lineWidth=4; ctx.strokeStyle="#ffeaac"; ctx.moveTo(i*LANE_W,0); ctx.lineTo(i*LANE_W,H); ctx.stroke(); }
            ctx.setLineDash([]); ctx.lineWidth=4; ctx.strokeStyle="#cb9e5e"; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(12,H); ctx.moveTo(W-12,0); ctx.lineTo(W-12,H); ctx.stroke();
            let offset = (Date.now() * 0.006) % 55;
            for(let y=offset-45; y<H+55; y+=50) { for(let l=0;l<LANE_COUNT;l++) { let cx = l*LANE_W + LANE_W/2; ctx.beginPath(); ctx.arc(cx,y,5,0,Math.PI*2); ctx.fillStyle="#fff5cf"; ctx.fill(); } }
        }
        
        function drawEnemies() { for(let e of enemies) { ctx.fillStyle=e.color; ctx.beginPath(); ctx.roundRect(e.x,e.y,e.w,e.h,10); ctx.fill(); ctx.fillStyle="#2c2c46"; ctx.beginPath(); ctx.roundRect(e.x+6,e.y+14,e.w-12,22,6); ctx.fill(); ctx.fillStyle="#aaccee"; ctx.fillRect(e.x+8,e.y+18,7,12); ctx.fillRect(e.x+e.w-15,e.y+18,7,12); ctx.fillStyle="#ff6644"; ctx.fillRect(e.x+4,e.y+e.h-12,8,6); ctx.fillRect(e.x+e.w-12,e.y+e.h-12,8,6); } }
        
        function drawPlayer() { if(invincible>0 && (Math.floor(Date.now()/50)%3===0)) ctx.globalAlpha=0.6; ctx.fillStyle=carColor; ctx.beginPath(); ctx.roundRect(player.x,player.y,CAR_W,CAR_H,12); ctx.fill(); ctx.fillStyle="#1a2f44"; ctx.beginPath(); ctx.roundRect(player.x+7,player.y+16,CAR_W-14,24,6); ctx.fill(); ctx.fillStyle="#b8e2ff"; ctx.fillRect(player.x+12,player.y+22,7,14); ctx.fillRect(player.x+CAR_W-19,player.y+22,7,14); ctx.fillStyle="#ffbb66"; ctx.fillRect(player.x+4,player.y+CAR_H-14,9,8); ctx.fillRect(player.x+CAR_W-13,player.y+CAR_H-14,9,8); ctx.fillStyle="#222831"; ctx.fillRect(player.x+4,player.y+4,7,18); ctx.fillRect(player.x+CAR_W-11,player.y+4,7,18); ctx.fillRect(player.x+4,player.y+CAR_H-22,7,18); ctx.fillRect(player.x+CAR_W-11,player.y+CAR_H-22,7,18); ctx.globalAlpha=1; }
        
        function drawGameOver() {
            if(!gameActive) {
                ctx.fillStyle = "#000000cc"; ctx.fillRect(0,0,W,H);
                ctx.font = "bold 46px 'Segoe UI'"; ctx.fillStyle = "#ff6644"; ctx.shadowBlur = 8; ctx.shadowColor = "#ff0000";
                ctx.fillText(translations[currentLang].gameOver, W/2-125, H/2-45);
                ctx.font = "bold 16px monospace"; ctx.fillStyle = "#ffcc88"; ctx.shadowBlur = 0;
                ctx.fillText(translations[currentLang].restartMsg, W/2-118, H/2+35);
            }
            if(currentSpeed > 7.5 && gameActive) { ctx.globalAlpha = 0.12; for(let i=0;i<10;i++) { ctx.fillStyle = `rgba(255,210,100,0.6)`; ctx.fillRect(Math.random()*W, Math.random()*H, 3, 20); } ctx.globalAlpha = 1; }
        }
        
        if(!CanvasRenderingContext2D.prototype.roundRect) { CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) { if(w<2*r) r=w/2; if(h<2*r) r=h/2; this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y); return this; }; }
        
        function render() { drawRoad(); drawEnemies(); drawPlayer(); drawGameOver(); }
        function gameLoop() { updateGame(); render(); requestAnimationFrame(gameLoop); }
        
        const modal = document.getElementById('menuModal');
        function openMenu() { document.getElementById('menuBest').innerText = bestScore; document.getElementById('menuMaxSpeed').innerText = maxSpeedKm; modal.classList.add('active'); }
        function closeMenu() { modal.classList.remove('active'); }
        function restartAndClose() { restartGame(); closeMenu(); }
        
        function setDifficulty(level) { difficulty = level; restartGame(); }
        function setLanguage(lang) { currentLang = lang; updateUITexts(); refreshUI(); }
        
        function initColorPicker() { document.querySelectorAll('.color-circle').forEach(c => { c.addEventListener('click', () => { let color = c.getAttribute('data-color'); if(color) carColor = color; document.querySelectorAll('.color-circle').forEach(c2 => c2.classList.remove('selected')); c.classList.add('selected'); }); }); document.querySelector('[data-color="#30d5ff"]')?.classList.add('selected'); }
        
        function bindEvents() {
            document.getElementById('leftControl').onclick = () => changeLane(-1);
            document.getElementById('rightControl').onclick = () => changeLane(1);
            document.getElementById('menuControl').onclick = openMenu;
            document.getElementById('restartFromMenu').onclick = restartAndClose;
            document.getElementById('closeMenuButton').onclick = closeMenu;
            document.querySelectorAll('.difficulty-opt').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.difficulty-opt').forEach(b => b.classList.remove('active')); btn.classList.add('active'); let diff = btn.getAttribute('data-diff'); if(diff === 'easy') setDifficulty('easy'); else if(diff === 'hard') setDifficulty('hard'); else setDifficulty('normal'); }; });
            document.querySelectorAll('.lang-opt').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.lang-opt').forEach(b => b.classList.remove('active')); btn.classList.add('active'); let lang = btn.getAttribute('data-lang'); if(lang === 'de') setLanguage('de'); else if(lang === 'tr') setLanguage('tr'); else setLanguage('en'); }; });
            document.querySelector('[data-lang="en"]')?.classList.add('active');
            window.addEventListener('keydown', (e) => { if(e.key === 'ArrowLeft' || e.key === 'a') { changeLane(-1); e.preventDefault(); } else if(e.key === 'ArrowRight' || e.key === 'd') { changeLane(1); e.preventDefault(); } else if(e.key === 'Escape') { if(modal.classList.contains('active')) closeMenu(); else openMenu(); e.preventDefault(); } });
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); let rect = canvas.getBoundingClientRect(); let scaleX = W / rect.width; let tx = (e.touches[0].clientX - rect.left) * scaleX; let laneIdx = Math.floor(tx / LANE_W); if(laneIdx>=0 && laneIdx<LANE_COUNT && gameActive) { player.lane = laneIdx; updatePlayerX(); } });
        }
        
        loadBest(); loadTotalGames(); updatePlayerX(); restartGame(); initColorPicker(); bindEvents(); updateUITexts(); gameLoop();
    })();
</script>
</body>
</html>
